[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidik"
dynamic = ["version"]
description = "SIDIK: Secret Identification and Dependency Inspection Kit (Offline Polyglot SAST & Multi-Ecosystem SCA)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Radityo Budi Waskito"},
    {name = "Fauzi Nur Ibrahim"},
    {name = "Raditya Ahmad Pratama"},
    {name = "Zayyan Fadhlur Rahman"},
    {name = "Muhammad Fahri Indra Saputra"},
    {name = "Mohamad Hilman"}
]
keywords = ["security", "sast", "sca", "secret-detection", "vulnerability-scanner", "osv", "sarif", "polyglot", "npm", "golang"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "packaging>=23.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/radityobw/SIDIK"
Documentation = "https://radityobw.github.io/SIDIK/"
Repository = "https://github.com/radityobw/SIDIK"
Issues = "https://github.com/radityobw/SIDIK/issues"
Changelog = "https://github.com/radityobw/SIDIK/blob/main/CHANGELOG.md"

[project.optional-dependencies]
gui = [
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
]
dev = [
    "python-docx>=1.2.0",
    "pip-audit>=2.10.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
sidik = "sidik.cli:main"
sidik-gui = "sidik.cli:launch_gui_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["sidik*"]

[tool.setuptools.package-data]
"sidik" = ["py.typed"]
"sidik.data" = ["*.json"]
"sidik.assets" = ["*.png", "*.ico"]

[tool.setuptools.dynamic]
version = {attr = "sidik._version.__version__"}

