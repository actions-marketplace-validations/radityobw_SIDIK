- id: sidik-security
  name: SIDIK Security Scanner (Secrets & Offline SCA)
  description: Scans staged Python, environment, and manifest files for hardcoded secrets and vulnerable packages offline.
  entry: sidik --fail-on high --quiet
  language: python
  files: '(\.py$|\.env(\..+)?$|\.ya?ml$|\.toml$|\.ini$|\.cfg$|requirements.*\.txt$|Pipfile(\.lock)?$|poetry\.lock$|uv\.lock$|setup\.py$)'
  pass_filenames: true

