name: "SIDIK Security Scanner (Offline SAST & SCA)"
description: "Offline polyglot SAST & multi-ecosystem OSV SCA (PyPI, npm, Go, Rust, Java, PHP, Ruby, .NET) with SARIF output."
author: "SIDIK Research Team - Universitas Sultan Ageng Tirtayasa"

branding:
  icon: "shield"
  color: "blue"

inputs:
  target:
    description: "Target directory or file path to scan"
    required: false
    default: "."
  mode:
    description: "Scan mode: all, secret, or dep"
    required: false
    default: "all"
  severity:
    description: "Minimum severity level to report (low, medium, high, critical)"
    required: false
    default: "low"
  fail-on:
    description: "Severity threshold to fail workflow with exit code 1 (none, any, low, medium, high, critical)"
    required: false
    default: "high"
  lang:
    description: "Report language: id or en"
    required: false
    default: "en"
  sarif-output:
    description: "Path to write SARIF v2.1.0 report for GitHub Code Scanning"
    required: false
    default: "sidik-results.sarif"

outputs:
  sarif-file:
    description: "Generated SARIF v2.1.0 file path"
    value: ${{ inputs.sarif-output }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install SIDIK Package
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}"

    - name: Run SIDIK Security Scan (SARIF v2.1.0 + PR Annotations + Gate Check)
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_LANG: ${{ inputs.lang }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif-output }}
      run: |
        sidik \
          --target "$INPUT_TARGET" \
          --mode "$INPUT_MODE" \
          --severity "$INPUT_SEVERITY" \
          --lang "$INPUT_LANG" \
          --format github \
          --sarif-output "$INPUT_SARIF_OUTPUT" \
          --fail-on "$INPUT_FAIL_ON" \
          --quiet

